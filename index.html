<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Binwise | Inventory dashboard template</title>
    <meta name="description" content="An inventory and warehouse dashboard: stock levels with low-stock alerts, products, purchase orders, suppliers and stock movements. Sample data for a fictional restaurant supply warehouse." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Binwise inventory dashboard" />
    <meta property="og:description" content="Stock levels, low-stock alerts, purchase orders, suppliers and stock movements." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f6f6f5" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme (or the device setting) before the page paints.
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This dashboard needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
